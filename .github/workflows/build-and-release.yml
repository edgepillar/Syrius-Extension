name: Build and package extension

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - development
      - manifest-v3
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Chrome/Brave package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      manifest_version: ${{ steps.metadata.outputs.manifest_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check toolchain
        run: |
          node --version
          npm --version

      - name: Validate project versions
        id: metadata
        shell: bash
        run: |
          manifest_version="$(node -p "require('./src/manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "$manifest_version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Invalid Chrome manifest version: $manifest_version"
            exit 1
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid npm package version: $package_version"
            exit 1
          fi

          if [[ "$manifest_version" != "$package_version" ]]; then
            echo "::error::The Chrome manifest version ($manifest_version) must match the npm package version ($package_version)."
            exit 1
          fi

          printf 'manifest_version=%s\n' "$manifest_version" >> "$GITHUB_OUTPUT"
          printf 'package_version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.metadata.outputs.manifest_version }}
        shell: bash
        run: |
          expected_tag="v${MANIFEST_VERSION}"
          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $TAG_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint source
        run: npm run lint

      - name: Check out pinned embedded ABI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenon-network/go-zenon
          ref: 667a69d9e9a418edf7580b08492ba5dcb9efd63a
          path: .test-fixtures/go-zenon
          sparse-checkout: vm/embedded/definition
          persist-credentials: false

      - name: Run focused regression tests
        env:
          GO_ZENON_ABI_DIR: .test-fixtures/go-zenon/vm/embedded/definition
        run: npm test

      - name: Check validation failure paths
        env:
          GO_ZENON_ABI_DIR: .test-fixtures/go-zenon/vm/embedded/definition
        run: node --test utils/validation-gates-test.js

      - name: Check release publication failure paths
        run: node --test utils/release-assets-test.js

      # The build refuses to package when a pinned notice source drifts; this
      # is the check that the refusal itself still works.
      - name: Check third-party notice generation
        run: node utils/third-party-readme-notices-test.js

      - name: Run dependency security regression tests
        run: npm run test:security

      - name: Run native browser regression tests
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_path"
          "$browser_path" --version
          CHROMIUM_PATH="$browser_path" npm run test:browser

      - name: Build production extension
        run: npm run build

      # Every other browser fixture substitutes the SDK boundary, which is how
      # wallet removal stayed broken in production builds while they all passed.
      # This one drives the package just built, with its real Argon2/AES path,
      # and includes an unshortened five-minute session expiry.
      - name: Qualify production keyfile lifecycle
        id: keyfiles
        timeout-minutes: 15
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_path"
          "$browser_path" --version
          CHROMIUM_PATH="$browser_path" \
            SYRIUS_EXTENSION_DIR="$PWD/build" \
            SYRIUS_LIFECYCLE_REPORT="$RUNNER_TEMP/syrius-keyfile-lifecycle-report.json" \
            node utils/keyfile-lifecycle-browser-test.js

      - name: Upload sanitized keyfile lifecycle report
        if: always() && (steps.keyfiles.outcome == 'success' || steps.keyfiles.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/syrius-keyfile-lifecycle-report.json
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Validate and package production build
        id: package
        env:
          MANIFEST_VERSION: ${{ steps.metadata.outputs.manifest_version }}
        shell: bash
        run: |
          test -f build/manifest.json

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('build/manifest.json', 'utf8'));

          if (manifest.manifest_version !== 3) {
            throw new Error('The production manifest is not Manifest V3.');
          }

          if (manifest.version !== process.env.MANIFEST_VERSION) {
            throw new Error('The production manifest version does not match the source manifest.');
          }
          NODE

          if find build -type f \( -name '*.map' -o -iname 'desktop.ini' -o -iname 'dekstop.ini' -o -iname 'thumbs.db' -o -iname 'ehthumbs.db' \) -print -quit | grep -q .; then
            echo "::error::The production package contains source maps or OS metadata."
            exit 1
          fi

          archive="syrius-extension-${MANIFEST_VERSION}-chrome-brave.zip"
          (cd build && zip -qr "../${archive}" .)

          if ! unzip -Z1 "$archive" | grep -qx 'manifest.json'; then
            echo "::error::The ZIP does not contain manifest.json at its root."
            exit 1
          fi

          sha256sum "$archive" > "${archive}.sha256"
          printf 'archive_name=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload direct Chrome/Brave package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 30
          archive: false

  minimum-chromium:
    name: Qualify candidate on Chromium 112
    if: >-
      github.repository == 'edgepillar/Syrius-Extension' &&
      github.ref == 'refs/heads/codex/qualify-integrated-2026-10-11' &&
      github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      SYRIUS_EXPECTED_PACKAGE_VERSION: ${{ needs.build.outputs.manifest_version }}

    steps:
      - name: Define owned minimum qualification paths
        shell: bash
        run: |
          printf 'SYRIUS_PACKAGE_DOWNLOAD_DIR=%s/minimum-runtime-download\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SYRIUS_MINIMUM_PACKAGE_DIR=%s/minimum-runtime-package\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SYRIUS_MINIMUM_PACKAGE_METADATA=%s/minimum-runtime-package.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SYRIUS_LIFECYCLE_REPORT=%s/minimum-runtime-report.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out exact qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download exact candidate ZIP without decompression
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: syrius-extension-${{ needs.build.outputs.manifest_version }}-chrome-brave.zip
          path: ${{ env.SYRIUS_PACKAGE_DOWNLOAD_DIR }}
          skip-decompress: true
          digest-mismatch: error

      - name: Validate untouched candidate ZIP and members
        id: prepare
        run: node utils/fixtures/minimum-runtime-artifact.js prepare

      - name: Install headful browser runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libgtk-3-0 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0

      - name: Download and natively extract pinned Chromium 112
        shell: bash
        run: |
          archive="$RUNNER_TEMP/chromium-linux-1055.zip"
          curl --fail --location --silent --show-error --output "$archive" \
            https://playwright-akamai.azureedge.net/builds/chromium/1055/chromium-linux.zip
          printf '%s  %s\n' '5dc43c51d3c226efeaf4f06c8aa9e993ac6e90cc36b9f5bb16b5a0deab13c268' "$archive" | sha256sum --check --status
          unzip -tq "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP/chromium-1055"
          browser="$RUNNER_TEMP/chromium-1055/chrome-linux/chrome"
          version="$("$browser" --version)"
          printf '%s\n' "$version"
          [[ "$version" =~ ^Chromium\ 112\.0\.5615\.29([[:space:]]|$) ]]
          printf 'CHROMIUM_PATH=%s\n' "$browser" >> "$GITHUB_ENV"

      - name: Run all fifteen production lifecycle cases under Xvfb
        id: minimum
        timeout-minutes: 15
        env:
          SYRIUS_EXTENSION_DIR: ${{ env.SYRIUS_MINIMUM_PACKAGE_DIR }}
        run: xvfb-run -a -s '-screen 0 1280x1024x24' node utils/keyfile-lifecycle-minimum-browser-test.js

      - name: Associate sanitized report with exact candidate ZIP
        if: always() && steps.prepare.outcome == 'success'
        run: node utils/fixtures/minimum-runtime-artifact.js finalize

      - name: Upload only sanitized minimum-runtime report
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ env.SYRIUS_LIFECYCLE_REPORT }}
          if-no-files-found: warn
          retention-days: 30
          archive: false

  release:
    name: Publish GitHub release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Chrome/Brave package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: syrius-extension-${{ needs.build.outputs.manifest_version }}-chrome-brave.zip
          path: release-assets
          skip-decompress: true

      - name: Recreate release checksum
        working-directory: release-assets
        env:
          MANIFEST_VERSION: ${{ needs.build.outputs.manifest_version }}
        shell: bash
        run: |
          archive="syrius-extension-${MANIFEST_VERSION}-chrome-brave.zip"
          test -f "$archive"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTO_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.manifest_version) }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} != 2 )); then
            echo "::error::Expected exactly two release assets, found ${#assets[@]}."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists. Increase the project version before publishing another release."
            exit 1
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release candidate commit is invalid."
            exit 1
          fi

          if ! tag_commit="$(gh api --paginate "repos/$GH_REPO/tags?per_page=100" \
            --jq 'if type != "array" then error("Invalid tag response") else .[] end | if type != "object" or (.name | type) != "string" or (.name | length) == 0 or (.commit | type) != "object" then error("Invalid tag response") else . end | . as $tag | .commit.sha | if type == "string" and length == 40 and test("^[0-9a-f]+$") then select($tag.name == env.TAG_NAME) else error("Invalid tag commit") end')"; then
            echo "::error::The remote release tag could not be checked safely."
            exit 1
          fi

          if [[ -n "$tag_commit" ]]; then
            if [[ ! "$tag_commit" =~ ^[0-9a-f]{40}$ || "$tag_commit" != "$TARGET_SHA" ]]; then
              echo "::error::The remote release tag does not uniquely match the candidate commit."
              exit 1
            fi
          elif [[ "$AUTO_RELEASE" != "true" ]]; then
            echo "::error::The release tag is missing from the remote repository."
            exit 1
          fi

          if [[ "$AUTO_RELEASE" == "true" ]]; then
            gh release create "$TAG_NAME" "${assets[@]}" \
              --target "$TARGET_SHA" \
              --title "Syrius Extension ${TAG_NAME#v}" \
              --generate-notes
            exit 0
          fi

          gh release create "$TAG_NAME" "${assets[@]}" \
            --title "Syrius Extension ${TAG_NAME#v}" \
            --generate-notes \
            --verify-tag
