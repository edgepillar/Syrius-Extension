name: Inert browser storage lifetime diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use the historical Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Compare inert storage across owned browser restarts
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_path"
          "$browser_path" --version
          CHROMIUM_PATH="$browser_path" node utils/storage-lifetime-browser-test.js
